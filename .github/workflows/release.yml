name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev pkg-config \
            file desktop-file-utils libfuse2t64
      - name: Build
        run: cargo build --release --locked -p clipdeck
      - name: Tarball
        run: |
          v="${GITHUB_REF_NAME#v}"
          d="dist/clipdeck-$v-linux-x86_64"
          mkdir -p "$d/icons"
          cp target/release/clipdeck README.md LICENSE "$d/"
          cp packaging/linux/io.github.qwerpik.clipdeck.desktop packaging/linux/io.github.qwerpik.clipdeck.metainfo.xml "$d/"
          cp assets/clipdeck-*.png assets/clipdeck.svg "$d/icons/"
          tar -C dist -czf "dist/clipdeck-$v-linux-x86_64.tar.gz" "clipdeck-$v-linux-x86_64"
      - name: AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          packaging/linux/build-appimage.sh "$PWD/appimagetool"
          mv dist/Clipdeck-x86_64.AppImage "dist/Clipdeck-${GITHUB_REF_NAME#v}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p clipdeck -p clipdeck-micfx

      # Code signing through SignPath (free for open source). Runs once the repository
      # variables SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG and the secret
      # SIGNPATH_API_TOKEN exist; until then releases are unsigned. Each request waits for a
      # manual approval in SignPath. Configurations: packaging/windows/signpath/*.xml.
      - name: Upload binaries for signing
        id: unsigned-bin
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            target/release/clipdeck.exe
            target/release/clipdeck_micfx.dll
      - name: Sign binaries
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-bin.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: target/signed
      - name: Use the signed binaries
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: Copy-Item target/signed/clipdeck.exe, target/signed/clipdeck_micfx.dll -Destination target/release -Force

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $d = "dist/clipdeck-$v-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item target/release/clipdeck.exe, target/release/clipdeck_micfx.dll, README.md, LICENSE -Destination $d
          New-Item -ItemType File -Path "$d/portable" | Out-Null
          Compress-Archive -Path "$d/*" -DestinationPath "dist/clipdeck-$v-windows-x64-portable.zip"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" packaging\windows\clipdeck.iss
      - name: Upload installer for signing
        id: unsigned-setup
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/*setup*.exe
      - name: Sign installer
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: dist-signed
      - name: Use the signed installer
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: Copy-Item dist-signed/*setup*.exe -Destination dist -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*setup*.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          if [ -n "${{ vars.SIGNPATH_PROJECT_SLUG }}" ]; then
            printf '\n[Code signing policy](https://github.com/qwerpik/clipdeck#code-signing-policy): free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).\n' >> notes.md
          else
            printf '\n**Windows:** this release is not code-signed yet ([code signing policy](https://github.com/qwerpik/clipdeck#code-signing-policy)); if SmartScreen warns, click *More info → Run anyway*.\n' >> notes.md
          fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          draft: false
