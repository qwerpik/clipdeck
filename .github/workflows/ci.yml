name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p clipdeck

  micfx-e2e:
    name: Windows in-mic effect (end to end)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p clipdeck -p clipdeck-micfx
      - name: Enable Windows Audio
        shell: pwsh
        run: |
          Set-Service AudioEndpointBuilder -StartupType Automatic
          Set-Service Audiosrv -StartupType Automatic
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          Get-Service Audiosrv, AudioEndpointBuilder
      - name: Install VB-CABLE (gives the runner a microphone)
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\vbcable"
          New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile "$d\vb.zip"
          Expand-Archive "$d\vb.zip" -DestinationPath $d -Force
          Get-ChildItem $d | Format-Table -AutoSize Name, Length
          $cat = Get-ChildItem $d -Filter *64*.cat | Select-Object -First 1
          if (-not $cat) { $cat = Get-ChildItem $d -Filter *.cat | Select-Object -First 1 }
          $cert = $null
          if ($cat) { $cert = (Get-AuthenticodeSignature $cat.FullName).SignerCertificate }
          if (-not $cert) { $cert = (Get-AuthenticodeSignature "$d\VBCABLE_Setup_x64.exe").SignerCertificate }
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "TrustedPublisher", "LocalMachine"
          $store.Open("ReadWrite"); $store.Add($cert); $store.Close()
          Start-Process -FilePath "$d\VBCABLE_Setup_x64.exe" -ArgumentList "-i","-h" -Wait
          Start-Sleep -Seconds 10
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table -AutoSize FriendlyName, Status
      - name: Allow desktop apps to use the microphone (privacy switch)
        shell: pwsh
        run: |
          foreach ($root in "HKLM:", "HKCU:") {
            $k = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow
            New-Item -Path "$k\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$k\NonPackaged" -Name Value -Value Allow
          }
      - name: Install the effect on CABLE Output and test it
        shell: pwsh
        run: |
          function cd-run([string[]]$a) {
            $p = Start-Process -FilePath target\release\clipdeck.exe -ArgumentList $a -Wait -NoNewWindow -PassThru `
              -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            Get-Content out.txt, err.txt | ForEach-Object { Write-Host $_ }
            return $p.ExitCode
          }
          cd-run @("micfx", "status") | Out-Host
          $c = cd-run @("micfx", "install", "`"CABLE Output`""); if ($c -ne 0) { throw "install failed ($c)" }
          cd-run @("micfx", "status") | Out-Host
          Start-Sleep -Seconds 3
          $c = cd-run @("micfx", "test", "`"CABLE Output`""); if ($c -ne 0) { throw "test failed ($c)" }
          $c = cd-run @("micfx", "uninstall"); if ($c -ne 0) { throw "uninstall failed ($c)" }
          cd-run @("micfx", "status") | Out-Host
