[package]
name = "clipdeck-platform"
description = "Virtual microphone, global hotkeys, tray and IPC backends for Linux and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
clipdeck-audio.workspace = true
clipdeck-core.workspace = true
crossbeam-channel.workspace = true
interprocess.workspace = true
parking_lot.workspace = true
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire.workspace = true
ashpd = { workspace = true, default-features = false, features = ["tokio", "global_shortcuts"] }
global-hotkey.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
global-hotkey.workspace = true
clipdeck-micfx-proto.workspace = true
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[lints]
workspace = true
